<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        .container{
            height: 700px;
            border: 1px solid black;
        }
        .header,.footer{
            height: 20%;
            width: 100%;
            background-color: brown;
            border: 1px solid black;
        }
        .centre{
            height: 60%;
            width: 100%;
            background-color: bisque;
            display: flex;
        }
        .left{
            height: 100%;
            width: 30%;
            background-color: antiquewhite;
            border: 1px solid black;
        }
        .right{
            height: 100%;
            width: 70%;
            background-color: wheat;
            border: 1px solid black;
        }
        .top{
            height: 50%;
        }
        .bottom{
            height: 50%;
            display: flex;
        }
        .bottom1{
            height: 100%;
            width: 50%;
            background-color: cadetblue;
        }
        .bottom2{
            width: 50%;
            background-color: sandybrown;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1 align="center">FLEX BOX</h1>
    <div class="container">
        <div class="header"></div>
        <div class="centre">
            <div class="left"></div>
            <div class="right">
                <div class="top"></div>
                <div class="bottom">
                    <div class="bottom1"></div>
                    <div class="bottom2"></div>
                </div>
            </div>
        </div>
        <div class="footer"></div>
    </div>
</body>
</html>
